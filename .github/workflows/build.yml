name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Set version (commit date + short sha)
        id: version
        shell: pwsh
        run: |
          $d = git log -1 --format=%cd --date=format:%Y%m%d
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=v$d-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name 夸克磁力链工具
          --paths src
          --add-data "templates;templates"
          src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 夸克磁力链工具-${{ steps.version.outputs.version }}
          path: dist/夸克磁力链工具.exe

  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: 夸克磁力链工具-${{ needs.build.outputs.version }}
          path: artifact

      # GitHub Release 附件 API 无法设置非 ASCII 名（上传/PATCH 均退化为 default.exe），
      # 附件固定用 ASCII 名，发布说明中提示下载后改名
      - name: Normalize file name
        run: mv "$(find artifact -type f -name '*.exe' | head -1)" artifact/quark-magnet-tool.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >
          gh release create "$VERSION" --target "${{ github.sha }}"
          --title "夸克磁力链工具 $VERSION"
          --notes "自动构建，版本号 = 提交日期 + 短SHA（commit ${{ github.sha }}）。下载 quark-magnet-tool.exe，建议重命名为 夸克磁力链工具.exe（不改名也可正常使用），与 磁力链.txt 放同一目录双击运行。"
          "artifact/quark-magnet-tool.exe"
